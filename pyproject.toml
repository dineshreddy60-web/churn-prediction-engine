[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-engine"
version = "0.1.0"
description = "Synthetic customer churn modeling and inference API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "uvicorn[standard]>=0.34",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3"]

[project.scripts]
churn-generate-data = "churn_prediction.data:main"
churn-train = "churn_prediction.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
